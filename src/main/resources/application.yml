---
# demo-spring application properties file

logging:
  level:
    root: "INFO"
#    org.springframework.web: INFO
    com.eguisse.demospring: ${LOG_LEVEL:INFO}
#    org.springframework.security.web: DEBUG
#    redis.clients.jedis: ${LOG_LEVEL:DEBUG}

management:
  endpoint:
    health:
      show-components: always
      show-details: always
      probes:
        enabled: true
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health, shutdown, prometheus
  prometheus:
    metrics:
      export:
        enabled: true






old:
  endpoint:
    metrics:
      enabled: true
    health:
      enabled: true
      show-details: always
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: true
  